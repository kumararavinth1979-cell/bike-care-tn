<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TN Bike Maintenance Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header & Search -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold cursor-pointer" onclick="hideBikeDetails()">🏍️ TN Bike Care</h1>
            <div class="w-full md:w-1/3 relative" id="search-container">
                <input type="text" id="searchInput" oninput="filterBikes()" placeholder="பைக் பெயரை தேடவும்... (எ.கா: Splendor)" class="w-full px-4 py-2 rounded-lg text-black focus:outline-none focus:ring-2 focus:ring-blue-300">
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- Home View: Bike List Grid -->
        <div id="homeView" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 fade-in">
            <!-- Bike cards will be injected here by JS -->
        </div>

        <!-- Detail View: Selected Bike Data -->
        <div id="detailView" class="hidden fade-in bg-white rounded-xl shadow-lg p-4 md:p-8">
            <button onclick="hideBikeDetails()" class="mb-4 bg-gray-200 hover:bg-gray-300 text-gray-800 px-4 py-2 rounded-lg font-medium transition flex items-center gap-2">
                ⬅️ Back
            </button>
            
            <h2 id="bikeTitle" class="text-3xl font-bold mb-4 text-center text-blue-700"></h2>
            
            <!-- Big Bike Image -->
            <div class="w-full h-64 md:h-96 rounded-xl overflow-hidden mb-8 border border-gray-200">
                <img id="bikeImage" src="" alt="Bike Image" class="w-full h-full object-cover">
            </div>

            <h3 class="text-2xl font-bold mb-4 border-b pb-2">Maintenance Parts</h3>
            
            <!-- Parts Grid -->
            <div id="partsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Part cards will be injected here -->
            </div>
        </div>
    </main>

    <script>
        // Bike Data Array (Add all your 50 bikes here)
        const bikes = [
            {
                id: 1,
                name: "Royal Enfield Classic 350",
                image: "https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=1000&q=80",
                parts: [
                    { name: "Engine Oil", image: "https://cdn.pixabay.com/photo/2014/10/24/09/27/engine-oil-500645_960_720.jpg", clean: "-", inspect: "1,000 km", replace: "5,000 km" },
                    { name: "Air Filter", image: "https://cdn.pixabay.com/photo/2016/11/29/03/46/auto-1867138_960_720.jpg", clean: "3,000 km", inspect: "5,000 km", replace: "15,000 km" },
                    { name: "Drive Chain", image: "https://images.unsplash.com/photo-1551694294-b258e709e3ee?auto=format&fit=crop&w=400", clean: "500 km", inspect: "500 km", replace: "10,000 km" },
                    { name: "Spark Plug", image: "https://cdn.pixabay.com/photo/2013/07/12/13/21/spark-plug-146896_960_720.png", clean: "5,000 km", inspect: "10,000 km", replace: "15,000 km" }
                ]
            },
            {
                id: 2,
                name: "Hero Splendor Plus",
                image: "https://images.unsplash.com/photo-1599819811279-d5ad9ce182ce?auto=format&fit=crop&w=1000&q=80",
                parts: [
                    { name: "Engine Oil", image: "https://cdn.pixabay.com/photo/2014/10/24/09/27/engine-oil-500645_960_720.jpg", clean: "-", inspect: "1,000 km", replace: "3,000 km" },
                    { name: "Air Filter", image: "https://cdn.pixabay.com/photo/2016/11/29/03/46/auto-1867138_960_720.jpg", clean: "2,000 km", inspect: "4,000 km", replace: "12,000 km" },
                    { name: "Brake Shoes", image: "https://cdn.pixabay.com/photo/2014/06/04/16/36/car-parts-362251_960_720.jpg", clean: "3,000 km", inspect: "6,000 km", replace: "15,000 km" }
                ]
            },
            {
                id: 3,
                name: "Bajaj Pulsar 150",
                image: "https://images.unsplash.com/photo-1449426468159-d96dbf08f19f?auto=format&fit=crop&w=1000&q=80",
                parts: [
                    { name: "Engine Oil", image: "https://cdn.pixabay.com/photo/2014/10/24/09/27/engine-oil-500645_960_720.jpg", clean: "-", inspect: "1,500 km", replace: "5,000 km" },
                    { name: "Air Filter", image: "https://cdn.pixabay.com/photo/2016/11/29/03/46/auto-1867138_960_720.jpg", clean: "3,500 km", inspect: "7,000 km", replace: "15,000 km" },
                    { name: "Chain & Sprocket", image: "https://images.unsplash.com/photo-1551694294-b258e709e3ee?auto=format&fit=crop&w=400", clean: "500 km", inspect: "1,000 km", replace: "15,000 km" }
                ]
            },
            {
                id: 4,
                name: "TVS Apache RTR 160",
                image: "https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?auto=format&fit=crop&w=1000&q=80",
                parts: [
                    { name: "Engine Oil", image: "https://cdn.pixabay.com/photo/2014/10/24/09/27/engine-oil-500645_960_720.jpg", clean: "-", inspect: "1,000 km", replace: "4,000 km" },
                    { name: "Oil Filter", image: "https://cdn.pixabay.com/photo/2014/06/04/16/36/car-parts-362251_960_720.jpg", clean: "-", inspect: "-", replace: "4,000 km" },
                    { name: "Brake Pads (Front)", image: "https://cdn.pixabay.com/photo/2014/06/04/16/36/car-parts-362251_960_720.jpg", clean: "2,000 km", inspect: "5,000 km", replace: "12,000 km" }
                ]
            },
            {
                id: 5,
                name: "Honda Activa 6G",
                image: "https://images.unsplash.com/photo-1629235084931-3141f2a3db6f?auto=format&fit=crop&w=1000&q=80",
                parts: [
                    { name: "Engine Oil", image: "https://cdn.pixabay.com/photo/2014/10/24/09/27/engine-oil-500645_960_720.jpg", clean: "-", inspect: "1,000 km", replace: "3,000 km" },
                    { name: "Gear Oil", image: "https://cdn.pixabay.com/photo/2014/10/24/09/27/engine-oil-500645_960_720.jpg", clean: "-", inspect: "3,000 km", replace: "6,000 km" },
                    { name: "Air Filter", image: "https://cdn.pixabay.com/photo/2016/11/29/03/46/auto-1867138_960_720.jpg", clean: "-", inspect: "-", replace: "12,000 km" }, // Activa uses viscous filter, only replace
                    { name: "Belt", image: "https://cdn.pixabay.com/photo/2014/06/04/16/36/car-parts-362251_960_720.jpg", clean: "-", inspect: "8,000 km", replace: "24,000 km" }
                ]
            }
        ];

        // DOM Elements
        const homeView = document.getElementById('homeView');
        const detailView = document.getElementById('detailView');
        const searchInput = document.getElementById('searchInput');
        const searchContainer = document.getElementById('search-container');
        
        // Initial Render
        function renderBikes(bikeArray) {
            homeView.innerHTML = '';
            if(bikeArray.length === 0) {
                homeView.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">பைக் எதுவும் கிடைக்கவில்லை.</p>`;
                return;
            }

            bikeArray.forEach(bike => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-md overflow-hidden cursor-pointer hover:shadow-xl hover:scale-105 transition duration-300";
                card.onclick = () => showBikeDetails(bike.id);
                card.innerHTML = `
                    <div class="h-48 w-full overflow-hidden">
                        <img src="${bike.image}" alt="${bike.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4 text-center">
                        <h3 class="text-lg font-bold text-gray-800">${bike.name}</h3>
                    </div>
                `;
                homeView.appendChild(card);
            });
        }

        // Filter Function for Search Bar
        function filterBikes() {
            const query = searchInput.value.toLowerCase();
            const filtered = bikes.filter(b => b.name.toLowerCase().includes(query));
            renderBikes(filtered);
        }

        // Show Single Bike Detail View
        function showBikeDetails(id) {
            const bike = bikes.find(b => b.id === id);
            if(!bike) return;

            document.getElementById('bikeTitle').innerText = bike.name;
            document.getElementById('bikeImage').src = bike.image;

            const partsGrid = document.getElementById('partsGrid');
            partsGrid.innerHTML = '';

            bike.parts.forEach(part => {
                const partCard = document.createElement('div');
                partCard.className = "bg-gray-50 border border-gray-200 rounded-lg flex overflow-hidden shadow-sm hover:shadow-md transition";
                
                // Left side: Part Image
                partCard.innerHTML = `
                    <div class="w-1/3 bg-gray-200">
                        <img src="${part.image}" alt="${part.name}" class="w-full h-full object-cover">
                    </div>
                    <!-- Right side: Content -->
                    <div class="w-2/3 p-4 flex flex-col justify-center">
                        <h4 class="text-lg font-bold text-gray-800 mb-2">${part.name}</h4>
                        <div class="text-sm space-y-1">
                            <div class="flex justify-between border-b pb-1"><span class="font-semibold text-blue-600">Clean:</span> <span>${part.clean}</span></div>
                            <div class="flex justify-between border-b pb-1 pt-1"><span class="font-semibold text-orange-500">Inspect:</span> <span>${part.inspect}</span></div>
                            <div class="flex justify-between pt-1"><span class="font-semibold text-red-600">Replace:</span> <span>${part.replace}</span></div>
                        </div>
                    </div>
                `;
                partsGrid.appendChild(partCard);
            });

            // Hide Home, Show Detail
            homeView.classList.add('hidden');
            searchContainer.classList.add('hidden'); // Hide search when viewing details
            detailView.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Hide Details and go back to Home
        function hideBikeDetails() {
            detailView.classList.add('hidden');
            homeView.classList.remove('hidden');
            searchContainer.classList.remove('hidden');
            searchInput.value = '';
            renderBikes(bikes); // Reset filter
        }

        // Load bikes on start
        renderBikes(bikes);
    </script>
</body>
</html>
